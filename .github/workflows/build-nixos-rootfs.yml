name: Build NixOS ARM64 RootFS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "configuration.nix"
      - ".github/workflows/build-nixos-rootfs.yml"

permissions:
  contents: write

concurrency:
  group: build-nixos-rootfs
  cancel-in-progress: true

env:
  # Ganti sesuai versi NixOS yang dipakai configuration.nix
  # contoh: nixos-unstable, nixos-25.11
  NIXPKGS_CHANNEL: nixos-unstable

jobs:
  build:
    name: Build NixOS ARM64 LXC
    # Runner ARM native: tanpa QEMU, jauh lebih cepat & stabil.
    # (gratis untuk repo public)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            max-jobs = auto

      - name: Verify environment
        run: |
          set -eux
          uname -m
          nix --version
          test -f configuration.nix
          echo "configuration.nix found"
          sed -n '1,240p' configuration.nix

      - name: Build ARM64 LXC RootFS
        run: |
          set -eux

          nix-build \
            -I "nixpkgs=channel:${NIXPKGS_CHANNEL}" \
            -E '
              let
                nixos = import <nixpkgs/nixos/lib/eval-config.nix> {
                  system = "aarch64-linux";
                  modules = [
                    <nixpkgs/nixos/modules/virtualisation/lxc-container.nix>
                    ./configuration.nix
                  ];
                };
              in nixos.config.system.build.tarball
            ' \
            -o ./nixos-arm64

      - name: Locate RootFS
        id: image
        run: |
          set -eux

          find -L ./nixos-arm64 -maxdepth 3 -type f -print

          SRC="$(find -L ./nixos-arm64 -type f \
            \( -name '*.tar.xz' -o -name '*.tar.zst' -o -name '*.tar.gz' \) \
            -print -quit)"

          if [ -z "$SRC" ]; then
            echo "ERROR: ARM64 LXC RootFS archive not found"
            exit 1
          fi

          # Salin keluar dari /nix/store dengan nama yang rapi
          EXT="${SRC#*.tar}"
          mkdir -p dist
          IMG="dist/nixos-arm64-rootfs-${GITHUB_RUN_NUMBER}.tar${EXT}"
          cp -L "$SRC" "$IMG"

          echo "IMAGE=$IMG" >> "$GITHUB_OUTPUT"

          ls -lh "$IMG"
          sha256sum "$IMG" | tee "$IMG.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMG: ${{ steps.image.outputs.IMAGE }}
        run: |
          set -eux

          TAG="nixos-arm64-build-${GITHUB_RUN_NUMBER}"
          SHA256="$(awk '{print $1}' "$IMG.sha256")"
          SIZE="$(du -h "$IMG" | awk '{print $1}')"

          {
            echo "NixOS ARM64 LXC RootFS."
            echo
            echo "- Build: #${GITHUB_RUN_NUMBER}"
            echo "- Channel: ${NIXPKGS_CHANNEL}"
            echo "- Architecture: aarch64-linux"
            echo "- Format: LXC RootFS"
            echo "- Size: ${SIZE}"
            echo
            echo "SHA256:"
            echo '```'
            echo "${SHA256}"
            echo '```'
            echo
            echo "Built automatically by GitHub Actions."
            echo
            echo "DroidSpaces target: https://github.com/Arkael-Dev/NixOs-RootFs-images"
            echo "NixOS: https://nixos.org/"
          } > release-notes.md

          gh release create "$TAG" "$IMG" "$IMG.sha256" \
            --repo "${{ github.repository }}" \
            --title "NixOS ARM64 RootFS — Build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md
